<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b3a2b;
    --ink-soft: #5c7864;
    --ink-faint: #a9baae;
    --rule: #d3ddd6;
    --ribbon: #d2352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    background: #ffffff;
    font-family: 'Courier Prime', 'Courier New', monospace;
    color: var(--ink);
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 18px;
    letter-spacing: 1px;
    margin: 0;
  }
  a.view-link {
    color: var(--ink-soft);
    font-size: 12px;
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
  }
  a.view-link:hover { color: var(--ink); border-color: var(--ink); }

  p.sub {
    color: var(--ink-soft);
    margin: 0 0 28px;
    font-size: 13px;
  }

  .dropzone {
    border: 1.5px dashed var(--rule);
    padding: 36px 20px;
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dropzone.drag {
    border-color: var(--ink);
    background: rgba(27,58,43,0.03);
  }
  .dropzone input { display: none; }
  .dropzone p { margin: 0 0 4px; font-size: 14px; }
  .dropzone p.hint { font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; }

  button.upload-btn {
    background: #ffffff;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button.upload-btn:hover { background: var(--ink); color: #fff; }

  #status {
    font-size: 12px;
    color: var(--ink-soft);
    min-height: 16px;
    margin: 10px 0 32px;
    text-align: center;
  }

  .rotation-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
    font-weight: 400;
  }
  .shuffle-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .shuffle-toggle input {
    accent-color: var(--ink);
    width: 13px;
    height: 13px;
    cursor: pointer;
  }
  .shuffle-toggle.on { color: var(--ink); font-weight: 700; }

  .track {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    gap: 10px;
    background: #ffffff;
    transition: opacity 0.15s ease;
  }
  .track:last-child { border-bottom: none; }
  .track.dragging {
    opacity: 0.35;
  }
  .drag-handle {
    color: var(--ink-faint);
    font-size: 14px;
    line-height: 1;
    cursor: grab;
    padding: 4px 2px;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .track .title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track .dur {
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .track button.del {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
    white-space: nowrap;
  }
  .track button.del:hover { color: var(--ribbon); }

  .empty {
    color: var(--ink-faint);
    font-size: 13px;
    text-align: center;
    padding: 24px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <h1>777 radio</h1>
    <a class="view-link" href="/" target="_blank">view live station &rarr;</a>
  </div>
  <p class="sub">upload tracks to add them to rotation</p>

  <div class="dropzone" id="dropzone">
    <p>drag audio files here, or click to browse</p>
    <p class="hint">mp3, wav, ogg, m4a, flac, aac — up to 200mb each</p>
    <input type="file" id="fileInput" multiple accept=".mp3,.wav,.ogg,.m4a,.flac,.aac">
    <button class="upload-btn" type="button" onclick="document.getElementById('fileInput').click()">choose files</button>
  </div>
  <div id="status"></div>

  <div class="rotation-header">
    <h2>rotation</h2>
    <label class="shuffle-toggle" id="shuffleToggle">
      <input type="checkbox" id="shuffleCheckbox">
      shuffle
    </label>
  </div>
  <div id="playlist"></div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const playlistEl = document.getElementById('playlist');

['dragenter','dragover'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); })
);
['dragleave','drop'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
);
dropzone.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) uploadFiles(e.target.files);
});

async function uploadFiles(files) {
  const formData = new FormData();
  for (const f of files) formData.append('audioFiles', f);

  statusEl.textContent = `uploading ${files.length} file(s)…`;
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = 'error: ' + data.error;
    } else {
      statusEl.textContent = `added ${data.added.length} track(s) to rotation`;
      loadPlaylist();
    }
  } catch (err) {
    statusEl.textContent = 'upload failed: ' + err.message;
  }
  fileInput.value = '';
}

function fmtDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let currentTracks = [];

async function loadPlaylist() {
  const res = await fetch('/api/playlist');
  currentTracks = await res.json();
  renderPlaylist();
}

function renderPlaylist() {
  if (currentTracks.length === 0) {
    playlistEl.innerHTML = '<p class="empty">nothing in rotation yet</p>';
    return;
  }

  playlistEl.innerHTML = currentTracks.map((t) => `
    <div class="track" data-id="${t.id}">
      <span class="drag-handle" draggable="true" title="Drag to reorder">&#8942;&#8942;</span>
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="dur">${fmtDuration(t.duration)}</div>
      <button class="del" onclick="deleteTrack('${t.id}')">remove</button>
    </div>
  `).join('');
}

async function saveOrder() {
  const order = currentTracks.map(t => t.id);
  await fetch('/api/reorder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order }),
  });
}

// --- Drag and drop reordering ---
// Rows are moved live as real DOM nodes during dragover (rather than
// re-rendering the list), since replacing the actively-dragged element's
// own DOM node mid-drag would cancel the browser's native drag session.
let draggedRow = null;

playlistEl.addEventListener('dragstart', (e) => {
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  draggedRow = handle.closest('.track');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedRow.dataset.id);
  // Let the browser capture the drag image before we dim the source row
  setTimeout(() => draggedRow.classList.add('dragging'), 0);
});

playlistEl.addEventListener('dragover', (e) => {
  if (!draggedRow) return;
  e.preventDefault(); // required to allow dropping
  const row = e.target.closest('.track');
  if (!row || row === draggedRow) return;

  const rect = row.getBoundingClientRect();
  const isAfter = e.clientY > rect.top + rect.height / 2;
  playlistEl.insertBefore(draggedRow, isAfter ? row.nextSibling : row);
});

playlistEl.addEventListener('drop', (e) => {
  e.preventDefault();
});

playlistEl.addEventListener('dragend', () => {
  if (!draggedRow) return;
  draggedRow.classList.remove('dragging');

  // Sync the in-memory order to match the DOM (which already reflects
  // wherever the row was dropped), then persist it.
  const newOrderIds = Array.from(playlistEl.children).map(el => el.dataset.id);
  currentTracks = newOrderIds
    .map(id => currentTracks.find(t => t.id === id))
    .filter(Boolean);

  draggedRow = null;
  saveOrder();
});

async function deleteTrack(id) {
  if (!confirm('Remove this track from rotation?')) return;
  await fetch(`/api/track/${id}`, { method: 'DELETE' });
  loadPlaylist();
}

// --- Shuffle toggle ---
const shuffleCheckbox = document.getElementById('shuffleCheckbox');
const shuffleToggle = document.getElementById('shuffleToggle');

async function loadShuffleState() {
  const res = await fetch('/api/shuffle');
  const data = await res.json();
  shuffleCheckbox.checked = data.enabled;
  shuffleToggle.classList.toggle('on', data.enabled);
}

shuffleCheckbox.addEventListener('change', async () => {
  const enabled = shuffleCheckbox.checked;
  shuffleToggle.classList.toggle('on', enabled);
  await fetch('/api/shuffle', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled }),
  });
});

loadPlaylist();
loadShuffleState();
</script>
</body>
</html>
