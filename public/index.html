<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On Air</title>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #16161a;
    --accent: #ff4d4d;
    --text: #f2f2f2;
    --muted: #8a8a8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a1a1f, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .on-air-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,77,77,0.12);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .artist {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 24px;
  }
  .progress-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 1s linear;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  button#playBtn {
    background: var(--accent);
    color: white;
    border: none;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,77,77,0.35);
    transition: transform 0.15s ease;
  }
  button#playBtn:active { transform: scale(0.94); }
  .up-next {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    color: var(--muted);
  }
  .up-next b { color: var(--text); }
  .status-msg {
    color: var(--muted);
    font-size: 14px;
  }
  .file-meta {
    margin-top: 18px;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="on-air-badge"><span class="dot"></span> ON AIR</div>
    <div id="content">
      <p class="status-msg">Tuning in…</p>
    </div>
  </div>

<script>
const audio = new Audio();
audio.preload = 'auto';
let currentTrackId = null;
let started = false;

const content = document.getElementById('content');

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function render(data) {
  if (data.status === 'empty') {
    content.innerHTML = '<p class="status-msg">Nothing in rotation yet. Check back soon.</p>';
    return;
  }

  const pct = Math.min(100, (data.positionInTrack / data.duration) * 100);

  content.innerHTML = `
    <h1 class="title">${escapeHtml(data.title)}</h1>
    <p class="artist">${escapeHtml(data.artist)}</p>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="time-row">
      <span>${fmtTime(data.positionInTrack)}</span>
      <span>${fmtTime(data.duration)}</span>
    </div>
    <button id="playBtn">▶</button>
    ${data.upNext ? `<div class="up-next">Up next: <b>${escapeHtml(data.upNext.title)}</b> — ${escapeHtml(data.upNext.artist)}</div>` : ''}
    <div class="file-meta">${escapeHtml(data.filename)}</div>
  `;

  document.getElementById('playBtn').addEventListener('click', () => {
    if (!started) {
      tuneIn(data);
      started = true;
      document.getElementById('playBtn').textContent = '❚❚';
    } else if (audio.paused) {
      audio.play();
      document.getElementById('playBtn').textContent = '❚❚';
    } else {
      audio.pause();
      document.getElementById('playBtn').textContent = '▶';
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function tuneIn(data) {
  currentTrackId = data.id;
  audio.src = `/stream/${data.filename}`;
  audio.currentTime = data.positionInTrack;
  audio.play().catch(err => console.warn('Playback blocked until user interacts:', err));
}

async function poll() {
  try {
    const res = await fetch('/api/now-playing');
    const data = await res.json();

    if (data.status === 'empty') {
      render(data);
      return;
    }

    // Track changed underneath us — re-tune automatically if already playing
    if (started && data.id !== currentTrackId) {
      tuneIn(data);
    }

    // Drift correction: if we've wandered more than 2s from where we should be, resync
    if (started && !audio.paused) {
      const expected = data.positionInTrack;
      const actual = audio.currentTime;
      if (Math.abs(expected - actual) > 2) {
        audio.currentTime = expected;
      }
    }

    render(data);

    // Re-attach play button listener reference after re-render
    if (started) {
      const btn = document.getElementById('playBtn');
      btn.textContent = audio.paused ? '▶' : '❚❚';
    }
  } catch (err) {
    console.error('Poll failed', err);
  }
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
