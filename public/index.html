<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 Radio</title>

<!-- Rich link previews (iMessage, Twitter/X, Facebook, Slack, etc.) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://radio.boxtrod.com/">
<meta property="og:title" content="777 Radio">
<meta property="og:description" content="777 radio">
<meta property="og:image" content="https://radio.boxtrod.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="777 Radio">
<meta name="twitter:description" content="777 radio">
<meta name="twitter:image" content="https://radio.boxtrod.com/assets/og-image.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b3a2b;
    --ink-soft: #5c7864;
    --ribbon: #d2352c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Courier Prime', 'Courier New', monospace;
    color: var(--ink);
    padding: 24px;
  }

  .page {
    width: min(92vw, 720px);
  }

  .page-content {
    transition: filter 0.35s ease;
  }
  .page-content.blurred {
    filter: blur(10px);
    pointer-events: none;
  }

  .logo-row {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    top: 0; /* set precisely by JS: halfway between viewport top and "click 777 to spin" */
    z-index: 5;
  }
  .logo {
    width: 54px;   /* 2x the previous size */
    height: 54px;
    cursor: pointer;
    display: block;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s ease;
  }
  .logo.hidden {
    display: none;
  }

  .hint-text {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    height: 18px;
    margin-bottom: 4px;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  .hint-text.hidden {
    opacity: 0;
  }

  .dot-row {
    display: flex;
    justify-content: center;
    height: 20px;
    margin-bottom: 6px;
  }
  .on-air-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ribbon);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .on-air-dot.live {
    opacity: 1;
    transform: scale(1);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .art-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1600 / 935;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .art-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    mask-image: url('/assets/station-mask.png');
    mask-size: 100% 100%;
    mask-repeat: no-repeat;
    -webkit-mask-image: url('/assets/station-mask.png');
    -webkit-mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
  }
  .vu-overlay.active {
    opacity: 1;
  }

  .meta {
    text-align: center;
    margin-top: 22px;
    min-height: 1.4em;
  }
  .meta .title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    line-height: 1.4;
  }

  .status-msg {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 22px;
  }

  .offcuts-overlay {
    position: fixed;
    inset: 0;
    padding: 45px 20px; /* keeps a clear border top/bottom/sides */
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--ribbon);
    cursor: pointer;
    z-index: 20;
  }
  .offcuts-overlay.hidden {
    display: none;
  }
  .offcuts-inner {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
    line-height: 1.4;
    /* font-size set dynamically by JS to fit the available space */
  }
  .offcuts-inner p {
    margin: 0 0 1em;
  }
  .offcuts-inner p:last-child {
    margin-bottom: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .on-air-dot.live { animation: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="logo-row" id="logoRow"><img class="logo" id="logoImg" src="/assets/logo.png" alt="777 Offcuts Radio"></div>
    <div class="page-content" id="pageContent">
      <div class="hint-text" id="hintText">click 777 to spin</div>
      <div class="dot-row"><span class="on-air-dot" id="onAirDot"></span></div>
      <div class="art-wrap" id="artWrap" title="Play / pause">
        <img class="art-photo" src="/assets/station-art.jpg" alt="777 Radio">
        <canvas class="vu-overlay" id="vuCanvas"></canvas>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="offcuts-overlay hidden" id="offcutsOverlay"><div class="offcuts-inner" id="offcutsInner"></div></div>
  </div>

<script>
const audio = new Audio();
audio.preload = 'auto';
let currentTrackId = null;
let started = false;
let latestData = null;

// --- Web Audio + canvas dot-matrix LED meter ---
// Each "7" is its own retro LED bargraph: a grid of dots per numeral,
// arranged in columns anchored to that numeral's true outline at each
// x-position (reusing the same precise per-column top/bottom data as the
// original bar meter). Columns fill from the bottom with audio level,
// like a classic hardware VU meter, with a little per-dot flicker for
// authentic LED texture.
let audioCtx = null;
let analyser = null;
let freqData = null;
let vuRafId = null;
const canvas = document.getElementById('vuCanvas');
const ctx = canvas.getContext('2d');

// Bounding box of each "7" (fractions of the 1600x935 artwork), plus the
// precise per-column top/bottom of the true numeral outline at 14 x-slices
// across its width - a "7" is diagonal, so this varies a lot slice to
// slice. Column positions for the dot grid reuse these slices directly.
const GLYPHS = [
  {x0:0.0657,x1:0.3222,slots:[{t:0.2864,b:0.3525},{t:0.2156,b:0.3523},{t:0.1969,b:0.6432},{t:0.1956,b:0.6432},{t:0.1956,b:0.6429},{t:0.1956,b:0.6424},{t:0.1964,b:0.6426},{t:0.1964,b:0.6434},{t:0.1972,b:0.6434},{t:0.1982,b:0.5781},{t:0.1993,b:0.5034},{t:0.2006,b:0.4286},{t:0.2011,b:0.3528},{t:0.2017,b:0.2812}]},
  {x0:0.3192,x1:0.5788,slots:[{t:0.2754,b:0.3544},{t:0.203,b:0.3546},{t:0.1951,b:0.6603},{t:0.1956,b:0.6619},{t:0.1964,b:0.6634},{t:0.1972,b:0.6634},{t:0.198,b:0.6626},{t:0.1985,b:0.6611},{t:0.199,b:0.6595},{t:0.1993,b:0.5871},{t:0.1993,b:0.5071},{t:0.2001,b:0.4286},{t:0.2003,b:0.3528},{t:0.1993,b:0.2791}]},
  {x0:0.5962,x1:0.8606,slots:[{t:0.2714,b:0.3499},{t:0.1993,b:0.3515},{t:0.1917,b:0.353},{t:0.1922,b:0.6508},{t:0.193,b:0.6526},{t:0.1935,b:0.6553},{t:0.194,b:0.6579},{t:0.1959,b:0.6595},{t:0.1977,b:0.6574},{t:0.1985,b:0.5971},{t:0.2001,b:0.5128},{t:0.2009,b:0.4344},{t:0.2017,b:0.3596},{t:0.2025,b:0.2849}]}
].map(g => ({
  ...g,
  y0: Math.min(...g.slots.map(s => s.t)),
  y1: Math.max(...g.slots.map(s => s.b)),
}));

const DOT_COLOR = '27,58,43'; // matches --ink, as an rgb() triple for use with alpha
const COLUMNS_PER_GLYPH = 14; // matches slots.length - reuses that precise data directly
const TARGET_DOT_RADIUS = 2; // fixed, uniform dot size everywhere - this is
                                // the "big dot" size, used consistently rather
                                // than shrinking to fit each column's local
                                // height. Columns get however many dots fit
                                // at this size instead.
const GRID_SPACING = 9.36; // fixed grid density (rows/columns), independent
                            // of dot size - this is what was in place when
                            // the grid density looked right (radius 3.6 x
                            // spacing factor 2.6). Changing dot size alone
                            // should never change how many dots there are.

// Per-glyph automatic gain + smoothing - the same approach proven out on the
// strand meter. One value per NUMERAL (not per column): splitting into many
// narrow per-column frequency slices made some columns noisy/inconsistent,
// which is very likely why only the treble numeral looked reactive. A single
// smoothed value per band, covering a wide log-spaced swath of spectrum, is
// far more robust and is what actually drives every dot in that numeral -
// they all move together, in sync with their assigned band.
// A rolling window of each band's recent raw levels, rescaled against the
// ACTUAL observed min/max within that window - not exponential decay
// tracking. Decay-based peak tracking turned out to fundamentally misfire
// for sustained, narrowly-oscillating content like bass: since raw never
// drops far below its own very recent value, "peak" ends up just shadowing
// "raw" almost exactly, making the ratio always come out near 1 regardless
// of any floor logic layered on top. A genuine rolling min/max doesn't have
// that failure mode - it captures the real recent range for any signal
// shape, impulsive (treble) or sustained (bass/mid) alike.
const WINDOW_SIZE = 90; // ~1.5s of history at 60fps
const glyphHistory = [[], [], []];
const smoothedAmps = [0, 0, 0];
const AMP_SMOOTHING = 0.15;

function sizeCanvas() {
  const wrap = document.getElementById('artWrap');
  const rect = wrap.getBoundingClientRect();
  // Retina displays report devicePixelRatio=2 or 3, meaning a full-DPR
  // canvas rasterizes 4-9x the actual pixels for the same visual size -
  // capping it trades a small amount of crispness for real frame-rate
  // headroom, invisible on small soft dots like these.
  const dpr = Math.min(window.devicePixelRatio || 1, 1.3);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

function setupAnalyser() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.8;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

// Deterministic pseudo-random hash (classic GLSL-style trick) - gives each
// dot a fixed, stable-across-frames "random" value with no spatial
// correlation to its neighbors, unlike a smooth function of position
// (which is what a simple sin(ci*k + ri*k) flicker amounts to - that
// creates a coherent traveling wave, exactly the "flowing flag" effect
// that needed fixing, not genuinely independent per-dot variation).
function hash(a, b, c) {
  const v = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719 + 1.0) * 43758.5453;
  return v - Math.floor(v);
}

// Compute log-spaced bin boundaries across [0, binCount) so each of `numBands`
// groups covers a musically even slice of the spectrum (low = a couple bass
// bins, high = a wide swath of treble bins) rather than plain linear
// division, which is dominated entirely by the first few bass bins.
function logBinEdges(numBands, binCount) {
  const edges = [0];
  const minBin = 1; // avoid log(0)
  for (let i = 1; i <= numBands; i++) {
    const frac = i / numBands;
    const bin = Math.round(minBin * Math.pow(binCount / minBin, frac));
    edges.push(Math.min(binCount, Math.max(edges[i - 1] + 1, bin)));
  }
  return edges;
}

// One normalized (0-1, AGC'd, smoothed) amplitude per glyph - left "7" is
// bass, middle is mids, right is treble, same split used throughout.
function getGlyphAmplitudes() {
  if (!analyser) return smoothedAmps;
  analyser.getByteFrequencyData(freqData);
  const edges = logBinEdges(GLYPHS.length, freqData.length);

  GLYPHS.forEach((_, gi) => {
    const startBin = edges[gi];
    const endBin = edges[gi + 1];
    let sum = 0, count = 0;
    for (let b = startBin; b < endBin; b++) { sum += freqData[b] || 0; count++; }
    const raw = count ? sum / count : 0;

    const hist = glyphHistory[gi];
    hist.push(raw);
    if (hist.length > WINDOW_SIZE) hist.shift();

    let peak = -Infinity, floor = Infinity;
    for (let i = 0; i < hist.length; i++) {
      if (hist[i] > peak) peak = hist[i];
      if (hist[i] < floor) floor = hist[i];
    }

    const range = Math.max(1, peak - floor);
    const normalized = Math.max(0, Math.min(1, (raw - floor) / range));
    smoothedAmps[gi] += (normalized - smoothedAmps[gi]) * AMP_SMOOTHING;
  });

  return smoothedAmps;
}

function drawDotMatrix(timestamp) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // A soft shadow feathers every dot's edge rather than the crisp default
  // circle - set once per frame (not per-dot) since it doesn't need to
  // vary, which keeps this cheap regardless of how many dots are drawn.
  ctx.shadowColor = `rgba(${DOT_COLOR},0.55)`;
  ctx.shadowBlur = 3;

  const amps = getGlyphAmplitudes();
  const t = timestamp / 1000;

  GLYPHS.forEach((g, gi) => {
    const amp = amps[gi];
    // Expand the low/mid range a bit (rather than a flat linear map) so
    // content that never quite reaches this band's all-time peak still
    // reads as clearly "reactive" instead of looking pinned small/dim.
    const curvedAmp = Math.pow(amp, 0.6);

    const radius = TARGET_DOT_RADIUS * (0.3 + 0.7 * curvedAmp);
    const alpha = 0.1 + 0.9 * curvedAmp;

    const gx0 = g.x0 * w;
    const gx1 = g.x1 * w;
    const colWidth = (gx1 - gx0) / COLUMNS_PER_GLYPH;
    const dotStep = GRID_SPACING;

    for (let ci = 0; ci < COLUMNS_PER_GLYPH; ci++) {
      const slot = g.slots[ci];
      const colTop = slot.t * h;
      const colBottom = slot.b * h;
      const colHeight = colBottom - colTop;
      const colCenterX = gx0 + (ci + 0.5) * colWidth;

      // However many dots fit at the fixed target size/spacing - short
      // slivers of the numeral (like the thin tips) just get fewer dots,
      // rather than every column being forced to the same dot count and
      // shrinking to fit.
      const rows = Math.max(1, Math.floor(colHeight / dotStep));

      for (let ri = 0; ri < rows; ri++) {
        const dotY = colBottom - (ri + 0.5) * (colHeight / rows);

        // Each dot flickers on its own independent, fixed-per-dot phase and
        // speed (via the hash above) - no two neighboring dots share a
        // predictable relationship, so nothing coherent sweeps across the
        // grid. Only the shared band-driven size/opacity moves together;
        // this flicker is pure independent per-dot texture.
        const phaseSeed = hash(gi, ci, ri);
        const speedSeed = hash(ci, ri, gi + 100);
        const flickerPhase = phaseSeed * Math.PI * 2;
        const flickerSpeed = 2.5 + speedSeed * 2.5;
        const flicker = 1 + 0.1 * Math.sin(t * flickerSpeed + flickerPhase);
        const dotRadius = Math.max(0.5, radius * flicker);
        const dotAlpha = Math.max(0.04, Math.min(1, alpha * flicker));

        ctx.beginPath();
        ctx.fillStyle = `rgba(${DOT_COLOR},${dotAlpha})`;
        ctx.arc(colCenterX, dotY, dotRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  });

  vuRafId = requestAnimationFrame(drawDotMatrix);
}

function startVu() {
  document.getElementById('vuCanvas').classList.add('active');
  if (vuRafId) cancelAnimationFrame(vuRafId);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  vuRafId = requestAnimationFrame(drawDotMatrix);
}
function stopVu() {
  if (vuRafId) cancelAnimationFrame(vuRafId);
  vuRafId = null;
  document.getElementById('vuCanvas').classList.remove('active');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function updatePlayingUI() {
  const isPlaying = started && !audio.paused;
  document.getElementById('onAirDot').classList.toggle('live', isPlaying);
  document.getElementById('hintText').classList.toggle('hidden', isPlaying);
  if (isPlaying) startVu(); else stopVu();
}

function render(data) {
  const meta = document.getElementById('meta');

  if (data.status === 'empty') {
    meta.innerHTML = '<p class="status-msg">Nothing in rotation yet.</p>';
    stopVu();
    return;
  }

  meta.innerHTML = `
    <p class="title">${escapeHtml(data.title)}</p>
  `;
}

function tuneIn(data) {
  currentTrackId = data.id;
  audio.src = `/stream/${data.filename}`;
  audio.currentTime = data.positionInTrack;
  setupAnalyser();
  audio.play()
    .then(updatePlayingUI)
    .catch(err => { console.warn('Playback blocked until user interacts:', err); updatePlayingUI(); });
}

document.getElementById('artWrap').addEventListener('click', () => {
  if (!latestData || latestData.status === 'empty') return;

  if (!started) {
    started = true;
    tuneIn(latestData);
  } else if (audio.paused) {
    audioCtx && audioCtx.resume();
    // Re-tune fresh to wherever the broadcast actually is right now,
    // rather than resuming stale audio/position from whenever this was
    // paused - matters if the rotation has moved on to a different track
    // in the meantime, and matches how a real radio works (you don't
    // pick up where you left off, you tune into whatever's live).
    tuneIn(latestData);
  } else {
    audio.pause();
    updatePlayingUI();
  }
});

// --- Logo <-> placeholder text overlay ---
const logoImg = document.getElementById('logoImg');
const offcutsOverlay = document.getElementById('offcutsOverlay');
const offcutsInner = document.getElementById('offcutsInner');
const logoRow = document.getElementById('logoRow');
const hintTextEl = document.getElementById('hintText');

// Position the logo exactly halfway between the top of the viewport and
// "click 777 to spin", recalculated whenever layout could have shifted.
function positionLogo() {
  const hintTop = hintTextEl.getBoundingClientRect().top;
  logoRow.style.top = Math.max(0, hintTop / 2) + 'px';
}
window.addEventListener('resize', positionLogo);
window.addEventListener('load', positionLogo);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(positionLogo);
}
positionLogo();

const OFFCUTS_HTML = `
<p>777 offcuts radio</p>
<p>is a place for the things i was making during the creation of this album to live and be shared</p>
<p>its like radio in the sense that you can&rsquo;t skip,<br>and when you press play you&rsquo;ll tune in wherever the broadcast is</p>
<p>i wanted to find a way to share all these pieces beyond the standard way music is listened to</p>
<p>you&rsquo;ll hear<br>voice memos,<br>demos,<br>production experiments,<br>songs i&rsquo;ve sampled,<br>remixes<br>maybe some poems<br>field recordings<br>and long improvisations</p>
<p>i&rsquo;ll be updating it regularly</p>
<p>tune in when you want, tune out when you want</p>
<p>it will always be here</p>
<p>stay curious,<br>boxtrod</p>
`;

function fitOffcutsText() {
  const overlayPaddingPx = 45 * 2; // top + bottom, matches .offcuts-overlay padding
  const availableHeight = window.innerHeight - overlayPaddingPx;

  let fontSize = 30; // starting point, same as the old fixed size
  offcutsInner.style.fontSize = fontSize + 'px';

  // A few passes: shrinking font-size can change line-wrapping (and thus
  // total height) non-linearly, so re-measure and adjust more than once.
  for (let i = 0; i < 6; i++) {
    const height = offcutsInner.scrollHeight;
    if (height <= availableHeight) break;
    const ratio = availableHeight / height;
    fontSize = Math.max(9, fontSize * ratio * 0.97); // small safety margin
    offcutsInner.style.fontSize = fontSize + 'px';
  }
}

function fillOffcutsText() {
  offcutsInner.innerHTML = OFFCUTS_HTML;
  fitOffcutsText();
}

function showOffcuts() {
  logoImg.classList.add('hidden');
  document.getElementById('pageContent').classList.add('blurred');
  // Unhide BEFORE measuring/fitting - while display:none, the element has
  // no layout box, so scrollHeight would read as 0 and the shrink logic
  // would never engage, leaving text at full (overflowing) size.
  offcutsOverlay.classList.remove('hidden');
  fillOffcutsText();
}

function hideOffcuts() {
  offcutsOverlay.classList.add('hidden');
  logoImg.classList.remove('hidden');
  document.getElementById('pageContent').classList.remove('blurred');
}

logoImg.addEventListener('click', (e) => {
  e.stopPropagation();
  showOffcuts();
});

window.addEventListener('resize', () => {
  if (!offcutsOverlay.classList.contains('hidden')) fitOffcutsText();
});

// While the overlay is showing, a click ANYWHERE dismisses it (intercepted
// in the capture phase so it doesn't also trigger play/pause on the artwork
// underneath in the same click).
document.addEventListener('click', (e) => {
  if (!offcutsOverlay.classList.contains('hidden')) {
    e.stopPropagation();
    e.preventDefault();
    hideOffcuts();
  }
}, true);

async function poll() {
  try {
    const res = await fetch('/api/now-playing');
    const data = await res.json();
    latestData = data;

    if (data.status === 'empty') {
      render(data);
      return;
    }

    const isNewTrack = data.id !== currentTrackId;
    // Only auto-follow the rotation into a new track while actually
    // playing. If paused, leave it alone entirely - a track change
    // shouldn't resume playback the user explicitly stopped. (Resuming
    // later re-tunes fresh to whatever's live then - see the click
    // handler below - so there's no need to track currentTrackId here
    // while paused.)
    if (started && !audio.paused && isNewTrack) {
      tuneIn(data);
    } else if (!started) {
      currentTrackId = data.id;
    }

    if (started && !audio.paused) {
      const expected = data.positionInTrack;
      const actual = audio.currentTime;
      if (Math.abs(expected - actual) > 2) {
        audio.currentTime = expected;
      }
    }

    render(data);
  } catch (err) {
    console.error('Poll failed', err);
  }
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
